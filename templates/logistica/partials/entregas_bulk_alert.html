<div class="mb-6 rounded-md p-4 {% if alert_type == 'success' %}bg-green-50 border border-green-200{% elif alert_type == 'warning' %}bg-yellow-50 border border-yellow-200{% else %}bg-red-50 border border-red-200{% endif %}" role="alert">
  <div class="flex">
    <div class="flex-shrink-0">
      {% if alert_type == 'success' %}
      <svg class="h-5 w-5 text-green-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
      </svg>
      {% elif alert_type == 'warning' %}
      <svg class="h-5 w-5 text-yellow-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
      </svg>
      {% else %}
      <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
      </svg>
      {% endif %}
    </div>
    <div class="ml-3">
      <h3 class="text-sm font-medium {% if alert_type == 'success' %}text-green-800{% elif alert_type == 'warning' %}text-yellow-800{% else %}text-red-800{% endif %}">
        {% if alert_type == 'success' %}¡Operación Exitosa!{% elif alert_type == 'warning' %}Atención{% else %}Error{% endif %}
      </h3>
      <div class="mt-2 text-sm {% if alert_type == 'success' %}text-green-700{% elif alert_type == 'warning' %}text-yellow-700{% else %}text-red-700{% endif %}">
        <p>{{ message }}</p>
      </div>
    </div>
  </div>
</div>
